<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التعليم التفاعلية - الفصل الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f3f4f6; color: #1f2937; margin: 0; }
        .canvas-container { touch-action: none; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between overflow-hidden">

    <!-- رأس الصفحة -->
    <header class="bg-white shadow-sm px-4 py-3 flex justify-between items-center z-20 border-b border-gray-200 shrink-0">
        <div class="flex items-center space-x-3 space-x-reverse">
            <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
            <h1 class="font-bold text-base text-gray-800">غرفة الفصل الذكي المباشرة 🎓</h1>
        </div>
        <div class="flex items-center space-x-2 space-x-reverse">
            <span id="room-status" class="text-xs bg-blue-50 text-blue-600 px-3 py-1 rounded-full font-medium border border-blue-100">جاري الاتصال...</span>
            <button onclick="toggleChat()" class="md:hidden bg-blue-600 text-white text-xs px-3 py-1.5 rounded-lg shadow">💬 الشات والملفات</button>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <div class="flex-1 flex overflow-hidden relative w-full h-[calc(100vh-60px)]">

        <!-- القسم الأيسر: الفيديو والسبورة -->
        <div class="flex-1 flex flex-col h-full bg-gray-100 relative">
            <!-- الفيديو (تم تعديله لوضع الغرفة المتفاعلة ليعمل فوراً بدون توقف) -->
            <div id="video-container" class="h-48 md:h-64 bg-black border-b border-gray-300 relative shrink-0">
                <iframe src="https://vdo.ninja/?room=SmartClassRoom2026_MainRoom" class="w-full h-full border-0" allow="camera;microphone;fullscreen;display-capture"></iframe>
            </div>

            <!-- السبورة التفاعلية -->
            <div class="flex-1 canvas-container bg-white relative cursor-crosshair">
                <div class="absolute top-2 right-2 bg-white/95 backdrop-blur border border-gray-200 shadow-sm rounded-lg p-1.5 flex items-center space-x-2 space-x-reverse z-10">
                    <input type="color" id="colorPicker" value="#2563eb" class="w-7 h-7 rounded border-0 cursor-pointer">
                    <select id="brushSize" class="text-xs border border-gray-300 rounded px-1.5 py-1 bg-white text-gray-700">
                        <option value="2">رفيع</option>
                        <option value="5" selected>متوسط</option>
                        <option value="12">سميك</option>
                    </select>
                    <button onclick="clearCanvas(true)" class="bg-red-50 text-red-600 hover:bg-red-100 text-xs px-2.5 py-1 rounded font-medium transition">مسح السبورة</button>
                </div>
                <canvas id="whiteboard" class="w-full h-full block"></canvas>
            </div>
        </div>

        <!-- القسم الأيمن: الشات والملفات -->
        <div id="chat-sidebar" class="w-full md:w-96 bg-white border-r border-gray-200 flex flex-col h-full absolute md:relative inset-y-0 right-0 transform translate-x-full md:translate-x-0 transition-transform duration-300 z-30 shadow-2xl md:shadow-none">
            <!-- رأس الشات -->
            <div class="p-3.5 border-b border-gray-200 flex justify-between items-center bg-gray-50 shrink-0">
                <h2 class="font-bold text-gray-800 text-xs flex items-center gap-2">💬 محادثة الفصل والملفات السحابية</h2>
                <button onclick="toggleChat()" class="md:hidden text-gray-500 hover:text-gray-700 text-lg font-bold px-2">✕</button>
            </div>

            <!-- رسائل الشات -->
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 bg-[#f8fafc] flex flex-col">
                <div class="text-center my-2">
                    <span class="bg-gray-200 text-gray-600 text-[10px] px-3 py-1 rounded-full">أهلاً بك! الرسائل والملفات تظهر للجميع فوراً 🚀</span>
                </div>
            </div>

            <!-- مؤشر الرفع -->
            <div id="upload-status" class="hidden px-4 py-2 bg-blue-50 border-t border-blue-100 text-blue-700 text-xs flex items-center justify-between shrink-0">
                <span id="upload-text">جاري رفع الملف للسحاب... 📚</span>
                <span class="animate-spin">⏳</span>
            </div>

            <!-- إدخال الرسائل والملفات -->
            <div class="p-3 bg-white border-t border-gray-200 flex items-center space-x-2 space-x-reverse shrink-0">
                <label class="cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-600 p-2.5 rounded-full transition flex items-center justify-center shrink-0" title="إرفاق ملف">
                    📎
                    <input type="file" id="fileInput" class="hidden" onchange="handleFileSelect(this)">
                </label>
                
                <input type="text" id="chatInput" placeholder="اكتب رسالتك هنا..." class="flex-1 border border-gray-300 rounded-full px-4 py-2 text-xs focus:outline-none focus:border-blue-500 bg-gray-50 text-gray-800" onkeypress="handleKeyPress(event)">
                
                <button onclick="sendChatMessage()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-full text-xs font-semibold shadow shrink-0 transition">إرسال</button>
            </div>
        </div>

    </div>

    <!-- كود الجافاسكريبت والاتصال -->
    <script>
        const myUsername = "طالب_" + Math.floor(Math.random() * 900 + 100);
        const mqttTopic = "smart_classroom_room_2026_main";
        
        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

        client.on('connect', () => {
            const statusEl = document.getElementById('room-status');
            statusEl.innerText = "متصل مباشر ✅";
            statusEl.className = "text-xs bg-green-50 text-green-700 px-3 py-1 rounded-full font-medium border border-green-200";
            client.subscribe(mqttTopic);
        });

        client.on('error', () => {
            const statusEl = document.getElementById('room-status');
            statusEl.innerText = "خطأ بالاتصال ❌";
            statusEl.className = "text-xs bg-red-50 text-red-700 px-3 py-1 rounded-full font-medium border border-red-200";
        });

        client.on('message', (topic, payload) => {
            try {
                const data = JSON.parse(payload.toString());
                if (data.type === 'chat') {
                    appendChatMessage(data.sender, data.message, data.sender === myUsername);
                } else if (data.type === 'file_share') {
                    appendFileCard(data.sender, data.fileName, data.fileSize, data.fileUrl, data.sender === myUsername);
                } else if (data.type === 'draw') {
                    drawOnCanvas(data.x0, data.y0, data.x1, data.y1, data.color, data.size, false);
                } else if (data.type === 'clear') {
                    const canvas = document.getElementById('whiteboard');
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            } catch (e) { console.error(e); }
        });

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            client.publish(mqttTopic, JSON.stringify({ type: 'chat', sender: myUsername, message: text }));
            input.value = '';
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendChatMessage(); }

        function appendChatMessage(sender, message, isMe) {
            const chatMessages = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
            div.innerHTML = `
                <span class="text-[10px] text-gray-500 mb-1 px-1">${sender}</span>
                <div class="max-w-[85%] px-3.5 py-2 rounded-2xl text-xs shadow-sm ${isMe ? 'bg-blue-600 text-white rounded-bl-none' : 'bg-white text-gray-800 border border-gray-200 rounded-br-none'}">
                    ${escapeHtml(message)}
                </div>
            `;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function handleFileSelect(input) {
            const file = input.files[0];
            if (!file) return;

            const uploadStatus = document.getElementById('upload-status');
            const uploadText = document.getElementById('upload-text');
            uploadStatus.classList.remove('hidden');
            uploadText.innerText = `جاري رفع (${file.name}) للسحاب... 📚`;

            const formData = new FormData();
            formData.append('files[]', file);

            try {
                const response = await fetch('https://uguu.se/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();

                if (result && result.success && result.files && result.files.length > 0) {
                    const fileUrl = result.files[0].url;
                    const fileSizeFormatted = (file.size / (1024 * 1024)).toFixed(2) + ' MB';
                    
                    client.publish(mqttTopic, JSON.stringify({
                        type: 'file_share',
                        fileName: file.name,
                        fileSize: fileSizeFormatted,
                        fileUrl: fileUrl,
                        sender: myUsername
                    }));
                } else {
                    alert('فشل رفع الملف، حاول مرة أخرى.');
                }
            } catch (error) {
                console.error("Upload error:", error);
                alert('حدث خطأ أثناء الاتصال بخدمة الرفع السحابي.');
            } finally {
                uploadStatus.classList.add('hidden');
                input.value = '';
            }
        }

        function appendFileCard(sender, fileName, fileSize, fileUrl, isMe) {
            const chatMessages = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} w-full`;
            div.innerHTML = `
                <span class="text-[10px] text-gray-500 mb-1 px-1">${sender} شارك ملف:</span>
                <div class="w-[90%] bg-white border border-gray-200 p-3 rounded-xl shadow-sm flex items-center justify-between">
                    <div class="flex items-center space-x-3 space-x-reverse overflow-hidden">
                        <span class="text-2xl bg-blue-50 p-2 rounded-lg">📄</span>
                        <div class="overflow-hidden">
                            <h4 class="text-gray-800 font-bold text-xs truncate">${escapeHtml(fileName)}</h4>
                            <span class="text-[10px] text-gray-400">${fileSize}</span>
                        </div>
                    </div>
                    <a href="${fileUrl}" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white text-[10px] px-3 py-2 rounded-lg font-semibold shrink-0 transition">
                        تحميل / معاينة
                    </a>
                </div>
            `;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        function toggleChat() {
            document.getElementById('chat-sidebar').classList.toggle('translate-x-full');
        }

        // السبورة البيضاء
        const canvas = document.getElementById('whiteboard');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let drawing = false, lastX = 0, lastY = 0;
        canvas.addEventListener('mousedown', (e) => startDraw(e.offsetX, e.offsetY));
        canvas.addEventListener('mousemove', (e) => draw(e.offsetX, e.offsetY));
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('mouseleave', stopDraw);

        canvas.addEventListener('touchstart', (e) => {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            startDraw(touch.clientX - rect.left, touch.clientY - rect.top);
            e.preventDefault();
        });
        canvas.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            draw(touch.clientX - rect.left, touch.clientY - rect.top);
            e.preventDefault();
        });
        canvas.addEventListener('touchend', stopDraw);

        function startDraw(x, y) { drawing = true; lastX = x; lastY = y; }
        function draw(x, y) {
            if (!drawing) return;
            drawOnCanvas(lastX, lastY, x, y, document.getElementById('colorPicker').value, document.getElementById('brushSize').value, true);
            lastX = x; lastY = y;
        }
        function stopDraw() { drawing = false; }

        function drawOnCanvas(x0, y0, x1, y1, color, size, broadcast) {
            ctx.beginPath();
            ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
            ctx.strokeStyle = color; ctx.lineWidth = size; ctx.lineCap = 'round';
            ctx.stroke(); ctx.closePath();

            if (broadcast) {
                client.publish(mqttTopic, JSON.stringify({ type: 'draw', x0, y0, x1, y1, color, size }));
            }
        }

        function clearCanvas(broadcast) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (broadcast) client.publish(mqttTopic, JSON.stringify({ type: 'clear' }));
        }
    </script>
</body>
</html>
