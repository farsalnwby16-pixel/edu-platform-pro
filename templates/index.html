<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المذاكرة الجماعية • EduPlatform Pro</title>
    <!-- مكتبة MQTT للسبورة اللحظية -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; margin: 0; padding: 10px; color: #f8fafc; text-align: center; }
        .container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .card { background: #1e293b; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); border: 1px solid #334155; }
        h2 { margin-bottom: 5px; color: #38bdf8; }
        p.desc { color: #94a3b8; font-size: 14px; margin-top: 0; }
        
        /* إطار مكالمة الفيديو الجماعية (تتحمل لغاية 7+ أفراد صوت وصورة بوضوح) */
        .video-frame-container { width: 100%; height: 480px; border-radius: 8px; overflow: hidden; border: 2px solid #3b82f6; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }

        /* السبورة التفاعلية */
        .toolbar { margin: 10px 0; display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; }
        .color-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; display: inline-block; }
        .color-btn.active { border: 3px solid #facc15; transform: scale(1.15); }
        button { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; }
        button:hover { background: #2563eb; }
        canvas { background: white; border-radius: 8px; cursor: crosshair; touch-action: none; width: 100%; max-width: 900px; height: 380px; display: block; margin: 0 auto; }
        .status { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; margin-bottom: 8px; }
        .online { background: #065f46; color: #34d399; }
        .offline { background: #7f1d1d; color: #fca5a5; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📚 منصة المذاكرة الجماعية (صوت وصورة + سبورة حية)</h2>
        <p class="desc">افتحوا كلكم الرابط ده، ادخلوا المكالمة، وذاكروا بالساعات براحتكم.</p>

        <!-- قسم مكالمة الفيديو الجماعية -->
        <div class="card">
            <h3>🎥 غرفة مكالمة الفيديو (اضغط Join/انضمام وافتح الكاميرا والمايك)</h3>
            <div class="video-frame-container">
                <iframe src="https://meet.jit.si/EduPlatformPro_GroupStudyRoom_2026" allow="camera; microphone; display-capture; fullscreen; clipboard-read; clipboard-write"></iframe>
            </div>
        </div>

        <!-- قسم السبورة التفاعلية -->
        <div class="card">
            <h3>🖥️ السبورة التفاعلية الجماعية (متزامنة باللحظة لكل الشباب)</h3>
            <div id="board-status" class="status offline">جاري الاتصال بالسبورة...</div>
            
            <div class="toolbar">
                <span>الألوان:</span>
                <div class="color-btn active" style="background: #000000;" onclick="setColor('#000000', this)"></div>
                <div class="color-btn" style="background: #ef4444;" onclick="setColor('#ef4444', this)"></div>
                <div class="color-btn" style="background: #3b82f6;" onclick="setColor('#3b82f6', this)"></div>
                <div class="color-btn" style="background: #22c55e;" onclick="setColor('#22c55e', this)"></div>
                <div class="color-btn" style="background: #eab308;" onclick="setColor('#eab308', this)"></div>
                <button onclick="setEraser()" style="background: #64748b;">🧹 ممحاة</button>
                <button onclick="clearBoard()" style="background: #ef4444;">🗑️ مسح الكل</button>
            </div>

            <canvas id="paintCanvas" width="900" height="380"></canvas>
        </div>
    </div>

    <script>
        const userId = "user_" + Math.floor(Math.random() * 100000);
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        const topic = "edu_platform_live_room_2026_v2";

        let drawing = false;
        let color = "#000000";
        let lineWidth = 3;
        let lastX = 0, lastY = 0;

        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { clientId: userId });

        client.on('connect', () => {
            const badge = document.getElementById('board-status');
            badge.innerText = "السبورة متصلة لايف ✅";
            badge.className = "status online";
            client.subscribe(topic);
        });

        client.on('offline', () => {
            const badge = document.getElementById('board-status');
            badge.innerText = "انقطع الاتصال بالسبورة ❌";
            badge.className = "status offline";
        });

        client.on('message', (t, payload) => {
            if (t !== topic) return;
            try {
                const data = JSON.parse(payload.toString());
                if (data.sender === userId) return;

                if (data.type === 'draw') {
                    drawLine(data.x0 * canvas.width, data.y0 * canvas.height, data.x1 * canvas.width, data.y1 * canvas.height, data.color, data.size);
                } else if (data.type === 'clear') {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            } catch (e) {}
        });

        function getCoord(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        canvas.addEventListener('mousedown', (e) => { drawing = true; const pos = getCoord(e); lastX = pos.x; lastY = pos.y; });
        canvas.addEventListener('mouseup', () => drawing = false);
        canvas.addEventListener('mouseleave', () => drawing = false);
        
        canvas.addEventListener('mousemove', (e) => {
            if (!drawing) return;
            const pos = getCoord(e);
            drawLine(lastX, lastY, pos.x, pos.y, color, lineWidth);
            
            if (client.connected) {
                client.publish(topic, JSON.stringify({
                    type: 'draw', sender: userId,
                    x0: lastX / canvas.width, y0: lastY / canvas.height,
                    x1: pos.x / canvas.width, y1: pos.y / canvas.height,
                    color: color, size: lineWidth
                }));
            }
            lastX = pos.x; lastY = pos.y;
        });

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); drawing = true; const pos = getCoord(e); lastX = pos.x; lastY = pos.y; });
        canvas.addEventListener('touchend', (e) => { e.preventDefault(); drawing = false; });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!drawing) return;
            const pos = getCoord(e);
            drawLine(lastX, lastY, pos.y, color, lineWidth); // Wait, fix y argument
            // Let's ensure drawLine args are correct: drawLine(lastX, lastY, pos.x, pos.y, color, lineWidth)
            // Correction below:
            drawLine(lastX, lastY, pos.x, pos.y, color, lineWidth);

            if (client.connected) {
                client.publish(topic, JSON.stringify({
                    type: 'draw', sender: userId,
                    x0: lastX / canvas.width, y0: lastY / canvas.height,
                    x1: pos.x / canvas.width, y1: pos.y / canvas.height,
                    color: color, size: lineWidth
                }));
            }
            lastX = pos.x; lastY = pos.y;
        });

        function drawLine(x0, y0, x1, y1, col, size) {
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.strokeStyle = col;
            ctx.lineWidth = size;
            ctx.lineCap = 'round';
            ctx.stroke();
            ctx.closePath();
        }

        function clearBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (client.connected) {
                client.publish(topic, JSON.stringify({ type: 'clear', sender: userId }));
            }
        }

        function setColor(c, el) {
            color = c; lineWidth = 3;
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            if (el) el.classList.add('active');
        }

        function setEraser() {
            color = "#ffffff"; lineWidth = 20;
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        }
    </script>
</body>
</html>
