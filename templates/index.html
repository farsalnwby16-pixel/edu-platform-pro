<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الفارس التعليمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; }
        .canvas-container { touch-action: none; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        canvas { touch-action: none; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-x-hidden">

    <!-- تنبيه متصفح ماسنجر -->
    <div id="webview-alert" class="hidden bg-amber-500 text-slate-950 font-bold px-4 py-2 text-center text-xs border-b border-amber-600">
        ⚠️ أنت تفتح المنصة من داخل تطبيق (ماسنجر/فيسبوك)! يرجى الضغط على (⋮) بالأعلى واختيار "فتح في Chrome" لكي تعمل الكاميرا.
    </div>

    <!-- رأس الصفحة -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-2 flex justify-between items-center shrink-0">
        <h1 class="font-bold text-sm text-slate-200">📚 منصة الفارس التعليمية</h1>
        <span id="room-status" class="text-[10px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/20">جاري الاتصال بالسيرفر...</span>
    </header>

    <!-- المحتوى الرئيسي -->
    <div class="flex-1 flex flex-col p-2 gap-2 overflow-y-auto">

        <!-- إطار المكالمات -->
        <div class="w-full h-72 md:h-80 bg-slate-950 rounded-xl border border-slate-800 overflow-hidden shrink-0">
            <iframe src="https://vdo.ninja/?room=FaresEduRoom2027&push&mesh" class="w-full h-full border-0" allow="camera;microphone;fullscreen;display-capture"></iframe>
        </div>

        <!-- قسم السبورة وأدوات الجداول -->
        <div class="flex-1 flex flex-col bg-slate-900 rounded-xl border border-slate-800 p-2 min-h-[480px]">
            <div class="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-slate-800 text-xs">
                <span class="font-bold text-slate-300">🎨 السبورة التفاعلية (كتابة ناعمة وسريعة)</span>
                
                <div class="flex flex-wrap items-center gap-2">
                    <!-- الألوان -->
                    <div class="flex items-center gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800">
                        <button onclick="setColor('#ef4444')" class="w-5 h-5 rounded-full bg-red-500 hover:scale-110 transition"></button>
                        <button onclick="setColor('#22c55e')" class="w-5 h-5 rounded-full bg-green-500 hover:scale-110 transition"></button>
                        <button onclick="setColor('#3b82f6')" class="w-5 h-5 rounded-full bg-blue-500 hover:scale-110 transition"></button>
                        <button onclick="setColor('#eab308')" class="w-5 h-5 rounded-full bg-yellow-500 hover:scale-110 transition"></button>
                        <button onclick="setColor('#ffffff')" class="w-5 h-5 rounded-full bg-white hover:scale-110 transition"></button>
                    </div>

                    <!-- مقاسات الخط -->
                    <select id="brushSize" class="bg-slate-950 border border-slate-800 text-slate-200 rounded-lg px-2 py-1 text-xs outline-none">
                        <option value="3">خط رفيع</option>
                        <option value="6" selected>خط متوسط</option>
                        <option value="12">خط تخين</option>
                    </select>

                    <button onclick="enableEraser()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1 rounded-lg transition font-medium">🧹 ممحاة</button>

                    <!-- الجداول -->
                    <select id="tableType" class="bg-indigo-950 border border-indigo-800 text-indigo-200 rounded-lg px-2.5 py-1 text-xs font-bold outline-none">
                        <option value="accounting">📊 جدول محاسبي</option>
                        <option value="wide">📐 جدول عريض</option>
                        <option value="long">📜 جدول طويل</option>
                        <option value="math">📉 شبكة بيانية</option>
                    </select>
                    
                    <button onclick="insertSelectedTable()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1 rounded-lg transition font-bold shadow">إدراج الجدول</button>
                    <button onclick="clearCanvas(true)" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 px-2.5 py-1 rounded-lg transition font-medium">مسح الكل</button>
                </div>
            </div>

            <!-- مساحة الرسم دقة 1200x800 موحدة -->
            <div class="flex-1 canvas-container bg-white rounded-lg mt-2 relative overflow-hidden cursor-crosshair flex items-center justify-center">
                <canvas id="whiteboard" width="1200" height="800" class="w-full h-full block bg-white object-contain"></canvas>
            </div>
        </div>

    </div>

    <script>
        // كشف متصفح ماسنجر/فيسبوك
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        if (ua.indexOf("FBAN") > -1 || ua.indexOf("FBAV") > -1 || ua.indexOf("Messenger") > -1) {
            document.getElementById('webview-alert').classList.remove('hidden');
        }

        const mqttTopic = "alfaris_edu_board_private_2027_v1";
        // استخدام سيرفر HiveMQ المجاني عالي الأداء مع اتصالات WebSockets
        const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

        client.on('connect', () => {
            document.getElementById('room-status').innerText = "متصل مباشر ✅";
            client.subscribe(mqttTopic);
        });

        const canvas = document.getElementById('whiteboard');
        const ctx = canvas.getContext('2d');

        // مخزن مؤقت لتجميع نقاط الرسم ومنع سقوط البيانات (Batching)
        let drawBuffer = [];

        client.on('message', (topic, payload) => {
            try {
                const data = JSON.parse(payload.toString());
                if (data.type === 'draw_batch') {
                    data.lines.forEach(line => {
                        drawOnCanvas(line.x0, line.y0, line.x1, line.y1, line.color, line.size, false);
                    });
                } else if (data.type === 'table') {
                    renderTablePreset(data.cols, data.rows, data.colW, data.rowH, false);
                } else if (data.type === 'clear') {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            } catch (e) { console.error(e); }
        });

        // إرسال حزمة الخطوط المجمعة كل 30 ملي ثانية لتفادي التقطيع والشرط
        setInterval(() => {
            if (drawBuffer.length > 0 && client && client.connected) {
                client.publish(mqttTopic, JSON.stringify({
                    type: 'draw_batch',
                    lines: drawBuffer
                }));
                drawBuffer = [];
            }
        }, 30);

        let drawing = false, lastX = 0, lastY = 0;
        let currentColor = '#3b82f6';

        function setColor(color) { currentColor = color; }
        function enableEraser() { currentColor = '#ffffff'; }

        function getCanvasCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function insertSelectedTable() {
            const type = document.getElementById('tableType').value;
            let cols = 4, rows = 6, colW = 120, rowH = 55;
            if (type === 'accounting') { cols = 3; rows = 8; colW = 180; rowH = 50; }
            else if (type === 'wide') { cols = 6; rows = 6; colW = 110; rowH = 50; }
            else if (type === 'long') { cols = 4; rows = 12; colW = 140; rowH = 40; }
            else if (type === 'math') { cols = 8; rows = 8; colW = 70; rowH = 70; }

            renderTablePreset(cols, rows, colW, rowH, true);
        }

        function renderTablePreset(cols, rows, colW, rowH, broadcast) {
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 2;
            const startX = 40, startY = 40;
            const totalWidth = cols * colW, totalHeight = rows * rowH;

            for (let i = 0; i <= rows; i++) {
                ctx.beginPath(); ctx.moveTo(startX, startY + (i * rowH));
                ctx.lineTo(startX + totalWidth, startY + (i * rowH)); ctx.stroke();
            }
            for (let j = 0; j <= cols; j++) {
                ctx.beginPath(); ctx.moveTo(startX + (j * colW), startY);
                ctx.lineTo(startX + (j * colW), startY + totalHeight); ctx.stroke();
            }

            if (broadcast) {
                client.publish(mqttTopic, JSON.stringify({ type: 'table', cols, rows, colW, rowH }));
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            const coords = getCanvasCoordinates(e);
            startDraw(coords.x, coords.y);
        });
        canvas.addEventListener('mousemove', (e) => {
            const coords = getCanvasCoordinates(e);
            draw(coords.x, coords.y);
        });
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('mouseleave', stopDraw);

        canvas.addEventListener('touchstart', (e) => {
            const coords = getCanvasCoordinates(e);
            startDraw(coords.x, coords.y);
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            const coords = getCanvasCoordinates(e);
            draw(coords.x, coords.y);
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchend', stopDraw);

        function startDraw(x, y) { drawing = true; lastX = x; lastY = y; }
        function draw(x, y) {
            if (!drawing) return;
            const size = document.getElementById('brushSize').value;
            drawOnCanvas(lastX, lastY, x, y, currentColor, size, true);
            lastX = x; lastY = y;
        }
        function stopDraw() { drawing = false; }

        function drawOnCanvas(x0, y0, x1, y1, color, size, broadcast) {
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.strokeStyle = color;
            ctx.lineWidth = size;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
            ctx.closePath();

            if (broadcast) {
                drawBuffer.push({
                    x0: Math.round(x0),
                    y0: Math.round(y0),
                    x1: Math.round(x1),
                    y1: Math.round(y1),
                    color,
                    size
                });
            }
        }

        function clearCanvas(broadcast) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (broadcast) client.publish(mqttTopic, JSON.stringify({ type: 'clear' }));
        }
    </script>
</body>
</html>
