<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPlatform Pro</title>
    <script src="https://download.agora.io/sdk/web/AgoraRTC_N-4.20.0.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f6f9; margin: 0; padding: 20px; }
        .card { background: white; padding: 15px; margin: 15px auto; max-width: 500px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        #video-container { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .video-box { width: 200px; height: 150px; background: #1a1a2e; border-radius: 8px; overflow: hidden; position: relative; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        canvas { border: 2px solid #007bff; border-radius: 8px; background: white; cursor: crosshair; touch-action: none; }
    </style>
</head>
<body>
    <h2>EduPlatform Pro • بث مباشر</h2>

    <div class="card">
        <h3>🎥 مكالمة الفيديو الحية (Agora)</h3>
        <button onclick="joinChannel()">تشغيل الكاميرا والمايك</button>
        <div id="video-container">
            <div id="local-player" class="video-box"></div>
            <div id="remote-player" class="video-box"></div>
        </div>
    </div>

    <div class="card">
        <h3>🖥️ السبورة التفاعلية</h3>
        <canvas id="paintCanvas" width="300" height="300"></canvas>
    </div>

    <script>
        const appId = "2b0b7c5a99f247de8305750411dd1296";
        const channel = "main-room";
        const token = null;

        let rtc = { client: null, localAudioTrack: null, localVideoTrack: null };

        async function joinChannel() {
            rtc.client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
            
            rtc.client.on("user-published", async (user, mediaType) => {
                await rtc.client.subscribe(user, mediaType);
                if (mediaType === "video") {
                    user.videoTrack.play("remote-player");
                }
                if (mediaType === "audio") {
                    user.audioTrack.play();
                }
            });

            await rtc.client.join(appId, channel, token, null);
            rtc.localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
            rtc.localVideoTrack = await AgoraRTC.createCameraVideoTrack();
            rtc.localVideoTrack.play("local-player");
            await rtc.client.publish([rtc.localAudioTrack, rtc.localVideoTrack]);
            alert("تم الانضمام للمكالمة بنجاح!");
        }

        // كود بسيط للرسم المحلي
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        canvas.addEventListener('mousedown', () => drawing = true);
        canvas.addEventListener('mouseup', () => drawing = false);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', () => drawing = true);
        canvas.addEventListener('touchend', () => drawing = false);
        canvas.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            draw({ clientX: touch.clientX - rect.left, clientY: touch.clientY - rect.top });
        });

        function draw(e) {
            if (!drawing) return;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#007bff';
            const x = e.clientX || e.clientX === 0 ? e.clientX - canvas.getBoundingClientRect().left : e.clientX;
            const y = e.clientY || e.clientY === 0 ? e.clientY - canvas.getBoundingClientRect().top : e.clientY;
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }
    </script>
</body>
</html>
